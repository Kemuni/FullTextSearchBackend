services:
  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    environment:
      - POSTGRES_DB=FullTextSearchDB
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
    volumes:
      - app-db-data:/var/lib/postgresql
#    networks:
#      - bridge

  elasticsearch:
    image: elasticsearch:9.5.1
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./elasticsearch-plugins.yml:/usr/share/elasticsearch/config/elasticsearch-plugins.yml:ro
#    networks:
#      - bridge

  kibana:
    image: kibana:9.5.1
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS="http://elasticsearch:9200"
    depends_on:
      - elasticsearch
#    networks:
#      - bridge

  backend:
    image: backend:latest
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      - db
      - elasticsearch
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health-check/" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    environment:
      - PROJECT_NAME=${PROJECT_NAME?Variable not set}
      - DATABASE_URL=postgresql://${POSTGRES_USER?Variable not set}:${POSTGRES_PASSWORD?Variable not set}@db:5432/${POSTGRES_DB?Variable not set}
      - ELASTICSEARCH_URL="http://elasticsearch:9200"
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD?Variable not set}
#    networks:
#      - bridge


volumes:
  app-db-data:
  elasticsearch_data:

